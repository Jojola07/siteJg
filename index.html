<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="noFilter.webp">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Joao Gugu</title>
    </head>
    <body>
        <!--cabeçalho com os botoes de navegação-->
        <header>
            <nav class="navbar">

                <div class="logo">
                    <img class="fotobot" src="noFilter.webp">
                    <h1>Joao Gugu Bot</h1>
                </div>

                <div class="links">
                    <a class="navt" href="#inicio">Início</a>
                    <a class="navt" href="#funcionalidades">Funcionalidades</a>
                    <a class="navt" href="#suporte">Suporte</a>
                </div>

            </nav>
        </header>
        <section id="inicio">
            <h1>Um bot para diversão<br>e movimentação para seu servidor</h1>
            <div class="iniciodiv">
                <a class="btnadd" href="https://discord.com/oauth2/authorize?client_id=1521691945640923177">Adicionar</a>
            </div>

            <div class="fotojoaomeio">
                <img class="joao" src="joaogugu.png">
            </div>
        </section>

        <section id="funcionalidades">
            <div class="cardbase">
                <div class="card">
                    <h2>Mensagens Engraçadas</h2>
                    <img src="print1.png">
                    <h3>Joao gugu pega mensagens do chat e cria as mensagens próprias!</h3>
                </div>

                <div class="card">
                    <h2>Gifs</h2>
                    <img src="print2.png">
                    <h3>Joao gugu manda um gif que já foi enviado.</h3>
                </div>

                <div class="card">
                    <h2>Emojis</h2>
                    <img src="print3.png">
                    <h3>Joao gugu manda emojis do seu servidor.</h3>
                </div>
            </div>
        </section>

    </body>
</html>
